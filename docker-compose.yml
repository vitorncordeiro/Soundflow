services:
  db:
    image: postgres:16-alpine
    container_name: pulse-player-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulse_player
    ports:
      - '5432:5432'
    volumes:
      - pulse_player_pgdata:/var/lib/postgresql/data
      # Cria tambem o banco pulse_player_test, usado pelos testes de integracao da API.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pulse_player']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pulse_player_pgdata:
